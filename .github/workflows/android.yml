name: Android Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Android Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Provision Android SDK and accept licenses
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK prerequisites
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Run unit tests and lint
        run: bash .github/scripts/verify-variants.sh
      - name: Resolve dependency inventory
        run: bash .github/scripts/gradle-ci.sh :app:writeDependencyInventory
      - name: Check known dependency advisories (OSV)
        run: python3 .github/scripts/audit-dependencies.py app/build/reports/dependency-audit/components.tsv
      - name: Upload diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.job }}
          path: |
            app/build/reports/lint-results-*.*
            app/build/test-results/test*UnitTest/*.xml
            app/build/reports/dependency-audit/*
          if-no-files-found: warn
  release:
    name: Android Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Provision Android SDK and accept licenses
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK prerequisites
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Run unit tests and lint
        run: bash .github/scripts/verify-variants.sh
      - name: Upload diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.job }}
          path: |
            app/build/reports/lint-results-*.*
            app/build/test-results/test*UnitTest/*.xml
          if-no-files-found: warn
      - name: Test APK audit and final-signature verification rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Assemble four debug APKs after verification
        run: bash .github/scripts/gradle-ci.sh :app:assembleFullArm32Debug :app:assembleFullArm64Debug :app:assembleLiteArm32Debug :app:assembleLiteArm64Debug
      - name: Inspect all four debug APKs
        run: bash .github/scripts/inspect-variants.sh debug
      - name: Assemble four unsigned release candidates after verification
        run: bash .github/scripts/gradle-ci.sh :app:assembleFullArm32Release :app:assembleFullArm64Release :app:assembleLiteArm32Release :app:assembleLiteArm64Release
      - name: Inspect unsigned release candidates
        run: bash .github/scripts/inspect-variants.sh release
      - name: Exercise final verifier with disposable CI test signer
        run: bash .github/scripts/smoke-signature-verification.sh
      - name: Upload APK inspection diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-audit
          path: app/build/reports/apk-audit/
          if-no-files-found: warn
      - name: Upload Najim-full-arm32-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-full-arm32-debug
          path: app/build/verified-apks/Najim-full-arm32-debug.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-full-arm64-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-full-arm64-debug
          path: app/build/verified-apks/Najim-full-arm64-debug.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-lite-arm32-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-lite-arm32-debug
          path: app/build/verified-apks/Najim-lite-arm32-debug.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-lite-arm64-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-lite-arm64-debug
          path: app/build/verified-apks/Najim-lite-arm64-debug.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload debug SHA-256 manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-debug-SHA256SUMS
          path: app/build/verified-apks/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload Najim-full-arm32-release-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-full-arm32-release-unsigned
          path: app/build/unsigned-release-candidates/Najim-full-arm32-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-full-arm64-release-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-full-arm64-release-unsigned
          path: app/build/unsigned-release-candidates/Najim-full-arm64-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-lite-arm32-release-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-lite-arm32-release-unsigned
          path: app/build/unsigned-release-candidates/Najim-lite-arm32-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload Najim-lite-arm64-release-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-lite-arm64-release-unsigned
          path: app/build/unsigned-release-candidates/Najim-lite-arm64-release-unsigned.apk
          compression-level: 0
          if-no-files-found: error
      - name: Upload release-unsigned SHA-256 manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Najim-release-unsigned-SHA256SUMS
          path: app/build/unsigned-release-candidates/SHA256SUMS.txt
          if-no-files-found: error
