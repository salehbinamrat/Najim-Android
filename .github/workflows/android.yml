name: Android Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    name: Android Core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Provision Android SDK and accept licenses
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK prerequisites
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Run unit tests and lint
        run: bash .github/scripts/gradle-ci.sh :app:testDebugUnitTest :app:lintDebug
      - name: Resolve dependency inventory
        run: bash .github/scripts/gradle-ci.sh :app:writeDependencyInventory
      - name: Check known dependency advisories (OSV)
        run: python3 .github/scripts/audit-dependencies.py app/build/reports/dependency-audit/components.tsv
      - name: Upload diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.job }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/dependency-audit/*
          if-no-files-found: warn
  release:
    name: Android Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Provision Android SDK and accept licenses
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK prerequisites
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
      - name: Run unit tests and lint
        run: bash .github/scripts/gradle-ci.sh :app:testDebugUnitTest :app:lintDebug
      - name: Upload diagnostics even on verification failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports-${{ github.job }}
          path: |
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Assemble debug APK after verification
        run: bash .github/scripts/gradle-ci.sh :app:assembleDebug
      - run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-preflight
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
